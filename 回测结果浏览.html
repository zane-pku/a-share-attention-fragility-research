<script>
"use strict";
const data=JSON.parse(document.getElementById("payload").textContent);
const byId=id=>document.getElementById(id);
const pct=x=>x==null?"—":(x*100).toFixed(2)+"%";
const delta=(x, digits, suffix="")=>x==null?"—":(x>0?"+":"")+x.toFixed(digits)+suffix;
function append(body, values, emphasis) {
  const row=document.createElement("tr");
  values.forEach((value,i)=>{
    const cell=document.createElement(i===0?"th":"td");
    if (i===0) cell.scope="row";
    cell.textContent=value;
    if (emphasis[i]) cell.className=emphasis[i];
    row.append(cell);
  });
  body.append(row);
}
function draw() {
  const dataset=byId("dataset").value, split=byId("split").value;
  const horizon=Number(byId("horizon").value),lag=Number(byId("lag").value);
  const selected=data.groups.filter(r=>r.dataset===dataset&&r.split===split&&r.horizon===horizon&&r.lag===lag);
  const body=byId("results");body.replaceChildren();
  const anchor=selected.find(r=>r.factor==="turnover_concentration");
  byId("basis").textContent=anchor ? "信号日 "+anchor.start+" 至 "+anchor.end+
    "。基准样本 "+anchor.n+" 个，最大回撤至少 "+(horizon===20?8:4)+"% 的事件率 "+pct(anchor.all_event)+"。" : "此设置无可用样本。";
  for(const r of selected) {
    append(body,[data.names[r.factor],r.n,r.n_high,r.n_low,pct(r.high_event),pct(r.low_event),
      delta(r.spread_event==null?null:r.spread_event*100,2," 个百分点"),delta(r.spread_return==null?null:r.spread_return*100,2,"%")],
      {6:r.spread_event>0?"risk":"lower"});
  }
  const forecast=byId("prediction");forecast.replaceChildren();
  const predictions=data.predictions.filter(r=>r.dataset===dataset);
  for(const factor of new Set(predictions.map(r=>r.factor))) {
    const observations=predictions.filter(r=>r.factor===factor);
    const total=observations.reduce((s,r)=>s+r.test_n,0);
    const average=observations.reduce((s,r)=>s+r.test_n*r.delta_brier,0)/total;
    const scores=[2023,2024,2025,2026].map(y=>delta(observations.find(r=>r.year===y)?.delta_brier,5));
    append(forecast,[data.names[factor],...scores,delta(average,5)],{5:average>0?"risk":"lower"});
  }
}
for(const id of ["dataset","split","horizon","lag"]) byId(id).addEventListener("change",draw);
draw();
</script>
